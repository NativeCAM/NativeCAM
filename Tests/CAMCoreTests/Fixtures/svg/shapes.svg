<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200mm" height="100mm" viewBox="0 0 200 100">
  <circle cx="20" cy="20" r="10"/>
  <ellipse cx="60" cy="20" rx="20" ry="10"/>
  <rect x="100" y="10" width="40" height="20" rx="5"/>
  <rect x="150" y="10" width="40" height="20" ry="5"/>
  <line x1="10" y1="50" x2="40" y2="50"/>
  <polyline points="60,50 80,50 80,70"/>
  <polygon points="100,50 140,50 120,80"/>
  <!-- a rectangle drawn as four separate lines: should chain into one closed loop -->
  <line x1="150" y1="50" x2="190" y2="50"/>
  <line x1="190" y1="50" x2="190" y2="80"/>
  <line x1="150" y1="80" x2="190" y2="80"/>
  <line x1="150" y1="50" x2="150" y2="80"/>
</svg>
