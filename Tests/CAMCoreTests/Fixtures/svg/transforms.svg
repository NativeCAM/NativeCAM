<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200mm" height="200mm" viewBox="0 0 200 200">
  <!-- nested groups: translate then scale: 20 x 20 square at (100,0) -->
  <g transform="translate(100,0)">
    <g transform="scale(2)">
      <rect x="0" y="0" width="10" height="10"/>
    </g>
  </g>
  <!-- rotate about a centre: 20 x 10 becomes 10 x 20 about (10,55) -->
  <rect x="0" y="50" width="20" height="10" transform="rotate(90 10 55)"/>
  <!-- transform list order: translate(50 50) scale(2,3) puts the unit square at (50..52, 50..53) -->
  <g transform="translate(50 50) scale(2,3)"><rect width="1" height="1"/></g>
  <!-- skewX(45): parallelogram (0,100) (20,100) (30,110) (10,110) -->
  <rect x="0" y="0" width="20" height="10" transform="translate(0,100) skewX(45)"/>
  <!-- matrix -->
  <path transform="matrix(1 0 0 1 150 150)" d="M0 0h10v10h-10z"/>
  <!-- nested svg viewport: 4 x 2 viewBox into 40 x 20 at (150,20) -->
  <svg x="150" y="20" width="40" height="20" viewBox="0 0 4 2"><rect width="4" height="2"/></svg>
  <!-- rotate without centre: (x,y) -> (y,-x) -->
  <g transform="rotate(-90)"><rect x="-190" y="100" width="20" height="10"/></g>
  <!-- skewY + scale with commas and no spaces -->
  <g transform="translate(150,100),skewY(45)"><rect width="10" height="10"/></g>
</svg>
