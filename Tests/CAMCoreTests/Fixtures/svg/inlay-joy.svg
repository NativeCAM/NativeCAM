    <path fill-rule="evenodd" d="M 410 225 A 80 100 0 1 1 250 225 A 80 100 0 1 1 410 225 Z M 368 225 A 38 58 0 1 0 292 225 A 38 58 0 1 0 368 225 Z"/>
    <path d="M 440 125 L 488 125 L 525 190 L 562 125 L 610 125 L 546 232 L 546 325 L 504 325 L 504 232 Z"/>
  </g>
