<!-- Written for NativeCAM's inlay tests (GPL-3.0-or-later). JOY in block capitals 2 in tall, with strokes 0.42 in
     wide, on a 7 x 4.5 in board (100 user units per inch). At a 0.2 in pocket depth with a 60 degree V-bit, a 1/8 in
