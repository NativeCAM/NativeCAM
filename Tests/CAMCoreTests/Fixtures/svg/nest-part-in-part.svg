<svg xmlns="http://www.w3.org/2000/svg" width="400mm" height="200mm" viewBox="0 0 400 200">
  <path fill-rule="evenodd" d="M10 20 H210 V170 H10 Z M40 50 H180 V140 H40 Z"/>
  <rect x="240" y="20" width="60" height="40"/>
  <circle cx="340" cy="60" r="20"/>
</svg>
