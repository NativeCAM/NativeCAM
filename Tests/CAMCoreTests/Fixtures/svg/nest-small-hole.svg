<?xml version="1.0" encoding="UTF-8"?>
<!-- NativeCAM nesting fixture (original drawing, GPL-3.0-or-later like the project), millimetres.
     A 200 x 150 panel with a 20 x 20 hole cut through it (one path, even-odd): too small for either loose part,
     a 60 x 40 rectangle and a 40 mm disc, so they nest beside it. -->
<svg xmlns="http://www.w3.org/2000/svg" width="400mm" height="200mm" viewBox="0 0 400 200">
  <path fill-rule="evenodd" d="M10 20 H210 V170 H10 Z M100 85 H120 V105 H100 Z"/>
  <rect x="240" y="20" width="60" height="40"/>
  <circle cx="340" cy="60" r="20"/>
</svg>
